[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "craziedrop-opt"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ngsolve",
    "numpy",
    "scipy",
    "matplotlib",
    "shapely",
]

[tool.setuptools]
py-modules = ["materials", "geometry", "solvers", "plotting"]
